name: DevSecOps Docker CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest tests/ -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          provenance: false
          sbom: false   
          tags: devsecops-gitops:scan
      
      - name: Inspect installed Python packages
        run: |
          docker run --rm --entrypoint python devsecops-gitops:scan \
            -m pip list --format=freeze

          docker run --rm --entrypoint python devsecops-gitops:scan \
            -m pip check

      - name: Investigate Trivy vulnerability sources
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 \
            image --format json --exit-code 0 \
            --severity HIGH,CRITICAL \
            --scanners vuln \
            devsecops-gitops:scan > trivy-debug.json

          python - <<'PY'
          import json

          with open("trivy-debug.json") as f:
              report = json.load(f)

          for result in report.get("Results", []):
              for vuln in result.get("Vulnerabilities") or []:
                  if vuln.get("PkgName") in ("msgpack", "setuptools", "urllib3"):
                      print({
                          "target": result.get("Target"),
                          "package": vuln.get("PkgName"),
                          "installed": vuln.get("InstalledVersion"),
                          "fixed": vuln.get("FixedVersion"),
                          "vulnerability": vuln.get("VulnerabilityID"),
                          "pkg_path": vuln.get("PkgPath"),
                          "pkg_id": vuln.get("PkgID"),
                      })
          PY

      - name: Inspect image SBOM and history
        run: |
          docker image inspect devsecops-gitops:scan \
            --format '{{json .Config.Labels}}'

          docker history --no-trunc devsecops-gitops:scan

              

      - name: Compare base image and application image
        run: |
          echo "===== BASE IMAGE SCAN ====="
          docker pull python:3.13-slim

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 \
            image --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            python:3.13-slim

          echo "===== APPLICATION IMAGE SCAN ====="
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 \
            image --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            devsecops-gitops:scan

          echo "===== ALPINE BASE IMAGE SCAN ====="
          docker pull python:3.13-alpine

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 \
            image --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            python:3.13-alpine

      - name: Inspect base image SBOM metadata
        run: |
          echo "===== DEBIAN IMAGE METADATA ====="
          docker image inspect python:3.13-slim \
            --format '{{json .Config.Labels}}'

          echo "===== ALPINE IMAGE METADATA ====="
          docker image inspect python:3.13-alpine \
            --format '{{json .Config.Labels}}'

          echo "===== RUNTIME PACKAGES IN ALPINE ====="
          docker run --rm python:3.13-alpine \
            python -m pip list --format=freeze

      - name: Diagnose Trivy SBOM findings
        run: |
          echo "===== SCAN WITHOUT IMAGE SBOM ATTESTATIONS ====="

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 \
            image \
            --image-config-scanners misconfig \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            devsecops-gitops:scan

      - name: Inspect Trivy SBOM package locations
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace" \
            aquasec/trivy:0.76.1 \
            image \
            --format cyclonedx \
            --output /workspace/trivy-sbom.json \
            devsecops-gitops:scan

          python - <<'PY'
          import json

          with open("trivy-sbom.json") as f:
              sbom = json.load(f)

          targets = {"msgpack", "setuptools", "urllib3"}

          for component in sbom.get("components", []):
              if component.get("name", "").lower() in targets:
                  print(json.dumps(component, indent=2))
          PY

      - name: Identify vulnerable package layer
        run: |
          echo "===== IMAGE HISTORY ====="
          docker history --no-trunc devsecops-gitops:scan

          echo "===== IMAGE ROOTFS LAYERS ====="
          docker image inspect devsecops-gitops:scan \
            --format '{{json .RootFS.Layers}}'

          echo "===== VERIFY RUNTIME PACKAGES ====="
          docker run --rm devsecops-gitops:scan \
            python -m pip list --format=freeze

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-gitops:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL  

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-gitops:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push approved image
        run: |
          docker tag devsecops-gitops:scan ghcr.io/seday1113/devsecops-gitops:${{ github.sha }}
          docker tag devsecops-gitops:scan ghcr.io/seday1113/devsecops-gitops:latest
          docker push ghcr.io/seday1113/devsecops-gitops:${{ github.sha }}
          docker push ghcr.io/seday1113/devsecops-gitops:latest
